<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Performance Support | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Access Control</h2>
                <p>Enter your credentials to manage diagnostics</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" required autocomplete="off" placeholder="e.g., admin_m_power">
                </div>

                <div class="input-group">
                    <label for="password">Security Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="login-btn">Authenticate</button>
            </form>

            <div class="m-stripes-divider"></div>
        </div>
    </div>

</body>
</html>
